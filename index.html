/* ---------- Drag to reorder chapters and lessons (Edit mode) ---------- */
let rdrag=null;
function rdragTarget(x,y){
  if(rdrag.kind==='chapter'){
    const list=[...document.querySelectorAll('.chapters>.chapter')].filter(c=>c!==rdrag.el);if(!list.length)return null;
    for(const [i,c] of list.entries()){const r=c.getBoundingClientRect();if(y<r.top+r.height/2)return{index:i,mark:c,side:'before'}}
    return{index:list.length,mark:list[list.length-1],side:'after'};
  }
  const el=document.elementFromPoint(x,y);if(!el)return null;
  if(rdrag.kind==='slesson'){const sc=el.closest('.side-ch');if(!sc)return null;
    const chId=+sc.dataset.ch,sum=sc.querySelector('summary'),rows=[...sc.querySelectorAll('.side-l')].filter(r=>r!==rdrag.el);
    if(el.closest('summary')||!sc.open)return{chId,index:rows.length,mark:sum,side:'into',details:sc};
    for(const [i,r] of rows.entries()){const rc=r.getBoundingClientRect();if(y<rc.top+rc.height/2)return{chId,index:i,mark:r,side:'before'}}
    return rows.length?{chId,index:rows.length,mark:rows[rows.length-1],side:'after'}:{chId,index:0,mark:sum,side:'into',details:sc}}
  const chEl=el.closest('.chapter[data-ch]');if(!chEl)return null;
  const chId=+chEl.dataset.ch,rows=[...chEl.querySelectorAll('.lesson[data-lesson]')].filter(r=>r!==rdrag.el);
  if(el.closest('.ch-head')||!chEl.classList.contains('open'))return{chId,index:rows.length,mark:chEl.querySelector('.ch-head'),side:'into'};
  for(const [i,r] of rows.entries()){const rc=r.getBoundingClientRect();if(y<rc.top+rc.height/2)return{chId,index:i,mark:r,side:'before'}}
  return rows.length?{chId,index:rows.length,mark:rows[rows.length-1],side:'after'}:{chId,index:0,mark:chEl.querySelector('.ch-head'),side:'into'};
}
function clearRMarks(){document.querySelectorAll('.rdrop-before,.rdrop-after,.rdrop-into').forEach(e=>e.classList.remove('rdrop-before','rdrop-after','rdrop-into'))}
function rdragUpdate(){if(!rdrag)return;rdrag.ghost.style.transform=`translate(${rdrag.left}px,${rdrag.y-rdrag.dy}px)`;
  clearRMarks();const t=rdragTarget(rdrag.left+20,rdrag.y);rdrag.target=t;if(t&&t.mark)t.mark.classList.add('rdrop-'+t.side);
  const d=t&&t.details&&!t.details.open?t.details:null;if(d!==rdrag.hoverCh){clearTimeout(rdrag.hoverT);rdrag.hoverCh=d;if(d)rdrag.hoverT=setTimeout(()=>{if(rdrag&&rdrag.hoverCh===d){d.open=true;rdragUpdate()}},500)}}
function rdragScroll(){if(!rdrag)return;const y=rdrag.y,edge=90,v=y<edge?-(edge-y)/4:y>innerHeight-edge?(y-(innerHeight-edge))/4:0;
  const side=rdrag.kind==='slesson'&&rdrag.el.closest('.side');
  if(side&&side.scrollHeight>side.clientHeight){const r=side.getBoundingClientRect(),e2=50,sv=y<r.top+e2?-(r.top+e2-y)/4:y>r.bottom-e2?(y-(r.bottom-e2))/4:0;if(sv){side.scrollTop+=sv;rdragUpdate()}}
  if(v){scrollBy(0,v);rdragUpdate()}rdrag.raf=requestAnimationFrame(rdragScroll)}
document.addEventListener('pointerdown',e=>{const h=e.target.closest&&e.target.closest('[data-rdrag]');if(!h||!editing()||e.button>0)return;e.preventDefault();
  const kind=h.dataset.rdrag,el=kind==='chapter'?h.closest('.chapter'):kind==='slesson'?h.closest('.side-l'):h.closest('.lesson'),r=el.getBoundingClientRect();
  const ghost=document.createElement('div');ghost.className='rdrag-ghost '+(kind==='chapter'?'chapter':kind==='slesson'?'side':'panel');
  ghost.appendChild((kind==='chapter'?el.querySelector('.ch-head'):el).cloneNode(true));ghost.style.width=r.width+'px';document.body.appendChild(ghost);
  document.querySelectorAll('.chapter.open').forEach(c=>openChapters.add(+c.dataset.ch));
  el.classList.add('rdrag-src');document.body.classList.add('dragging');
  rdrag={kind,id:+h.dataset.id,el,ghost,left:r.left,dy:e.clientY-r.top,y:e.clientY,y0:e.clientY,pid:e.pointerId,target:null};
  try{h.setPointerCapture(e.pointerId)}catch(err){}rdragUpdate();rdrag.raf=requestAnimationFrame(rdragScroll)});
document.addEventListener('pointermove',e=>{if(!rdrag||e.pointerId!==rdrag.pid)return;e.preventDefault();rdrag.y=e.clientY;rdragUpdate()},{passive:false});
async function endRDrag(e,cancel){if(!rdrag||(e&&e.pointerId!==rdrag.pid))return;const d=rdrag;rdrag=null;cancelAnimationFrame(d.raf);
  clearTimeout(d.hoverT);d.ghost.remove();d.el.classList.remove('rdrag-src');document.body.classList.remove('dragging');clearRMarks();
  const t=d.target;if(cancel||!t||Math.abs(d.y-d.y0)<4)return;
  const cid=parseInt(location.hash.split('/')[2]),c=find(cid).course;if(!c)return;
  if(d.kind==='slesson')sideOpen.set(t.chId,true);
  try{
    if(d.kind==='chapter'){if(c.chapters.findIndex(x=>x.id===d.id)===t.index)return;
      await api('POST',`chapters/${d.id}/place`,{course_id:c.id,index:t.index});await refresh();render();toast('Chapter moved')}
    else{const from=c.chapters.find(x=>x.lessons.some(l=>l.id===d.id));if(from.id===t.chId&&from.lessons.findIndex(l=>l.id===d.id)===t.index)return;
      await api('POST',`lessons/${d.id}/place`,{chapter_id:t.chId,index:t.index});openChapters.add(t.chId);if(d.kind==='slesson')sideOpen.set(t.chId,true);await refresh();render();
      toast(from.id===t.chId?'Lesson moved':`Lesson moved to “${c.chapters.find(x=>x.id===t.chId).title}”`)}
  }catch(ex){toast(ex.message)}}
document.addEventListener('pointerup',e=>endRDrag(e,false));
document.addEventListener('pointercancel',e=>endRDrag(e,true));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&rdrag){endRDrag(null,true);return}
  const h=document.activeElement&&document.activeElement.closest&&document.activeElement.closest('[data-rdrag]');
  if(!h||!editing()||(e.key!=='ArrowUp'&&e.key!=='ArrowDown'))return;e.preventDefault();

          :`<div class="test-ic warn">!</div><div class="who"><b>No test yet</b><span>${isAdmin()?'Every course needs a multiple-choice test. Learners can’t complete the course until they pass it.':'An admin hasn’t added this course’s test yet.'}</span></div>`}
        ${learnerView&&hasTest(c)?`<a class="btn btn-primary btn-sm" href="#/test/${c.id}">${s.testPassed?'Retake':'Take test'}</a>`:''}
        ${isAdmin()?`<a class="btn btn-gray btn-sm" href="#/test-edit/${c.id}">${hasTest(c)?'Edit test':'Create test'}</a>`:''}
      </div></div>
    ${!learnerView?trainersSection(c):''}
    ${!learnerView?`<div class="section" id="learners"><div class="section-head"><h2>Assigned learners</h2><span class="count">${stateChips(cnt)||'No activity yet'}</span>
      <div class="tools"><input class="input search-in" id="lq" placeholder="Search learners">${isAdmin()?`<button class="btn btn-sm btn-gray" data-act="assignPeople" data-id="${c.id}">Assign</button>`:''}</div></div>
      <div class="panel rows" id="lrows">${L.length?'':`<div class="empty" style="padding:36px"><p>${isAdmin()?'No learners are assigned to this course yet. Use <b>Assign people</b> to add learners and trainers with deadlines.':'No learners are assigned to this course yet.'}</p></div>`}</div></div>`:''}`;
  if(!learnerView){
    const order={overdue:0,progress:1,todo:2,late:3,done:4};
    const draw=q=>{const rows=LS.filter(({u})=>!q||(u.name+' '+u.designation).toLowerCase().includes(q)).sort((a,b)=>order[a.s.key]-order[b.s.key]||a.u.name.localeCompare(b.u.name));
      if(L.length)$('#lrows').innerHTML=rows.map(({u,s})=>{const lp=learnerPct(u.id,c),ta=(c.testAssigned||{})[u.id];return`<div class="row click" data-go="#/learner/${u.id}/${c.id}">${avatar(u)}
        <div class="who"><b>${esc(u.name)}</b><span>${esc(u.designation)} · ${esc(s.done?`Completed ${fmtDue(s.at)}`:dueText(s.due))}</span></div>
        ${stPill(s.key)}<span class="small">Test ${s.best?s.best.pct+'%':ta&&!s.testPassed?'assigned':'—'}</span>
        <div class="prog">${bar(lp)}<span class="pct">${lp}%</span></div>
        ${canTrain(c)?`<button class="btn btn-sm btn-gray" data-go="#/learner/${u.id}/${c.id}">Sign off</button>`:''}</div>`}).join('')||'<div class="empty" style="padding:30px"><p>No matches.</p></div>'};
    draw('');$('#lq').oninput=e=>draw(e.target.value.trim().toLowerCase());
    if(location.hash.endsWith('#learners'))setTimeout(()=>$('#learners')?.scrollIntoView({behavior:'smooth'}),50);
  }
}

function avgOfBest(L,c){const b=L.map(u=>bestAttempt(u.id,c.id)).filter(Boolean);return b.length?Math.round(b.reduce((s,a)=>s+a.pct,0)/b.length):null}

        <div class="lesson-foot">

          ${isAdmin()?`<button class="btn btn-gray" data-act="newLAt" data-c="${c.id}" data-ch="${ch.id}" data-index="${ch.lessons.indexOf(l)+1}">${I.plus} Lesson after this</button>`:''}
          <div class="spacer"></div>
          ${isAdmin()?`<a class="btn btn-gray" href="#/edit/${c.id}/${l.id}">${I.edit} Edit lesson</a>`:''}
          ${isLearner()?`${done?`<button class="btn btn-gray" data-act="toggleMine" data-id="${l.id}">${I.check} Completed</button>`:''}
            <button class="btn btn-primary" data-act="completeNext" data-id="${l.id}" data-next="${next?`#/lesson/${c.id}/${next.id}`:`#/course/${c.id}`}">${done?(next?'Next lesson':'Back to course'):(next?'Complete & continue':'Complete course')}</button>`
          :`<a class="btn btn-primary" href="${next?`#/lesson/${c.id}/${next.id}`:`#/course/${c.id}`}">${next?'Next lesson':'Back to course'}</a>`}
        </div>

  if(lastLessonShown!==l.id){lastLessonShown=l.id;scrollTo(0,0)}

/* ---------- Dashboard (admin + trainer) ---------- */
function viewDashboard(){
  if(ui.dashDept&&!depts.some(x=>String(x.id)===String(ui.dashDept)))ui.dashDept='';
  const courses=allCourses().filter(c=>!ui.dashDept||courseDept(c)===+ui.dashDept),L=isAdmin()&&!ui.dashDept?learners():learners().filter(u=>courses.some(c=>isEnrolled(u.id,c)));
  const desigs=[...new Set(L.map(u=>u.designation).filter(Boolean))].sort();
  const pairs=[];for(const u of L)for(const c of courses)if(isEnrolled(u.id,c))pairs.push({u,c,s:courseState(u.id,c)});
  const cnt=countStates(pairs.map(p=>p.s));
  const avg=pairs.length?Math.round(pairs.reduce((a,p)=>a+learnerPct(p.u.id,p.c),0)/pairs.length):0;
  const perf=L.map(u=>avgScore(u.id,courses.filter(c=>isEnrolled(u.id,c)))).filter(v=>v!=null);
  const teamScore=perf.length?Math.round(perf.reduce((a,b)=>a+b,0)/perf.length):null;
  const pendingTests=pairs.filter(p=>hasTest(p.c)&&!p.s.testPassed).length;
  const lastAct=uid=>{const m=team.byUser.get(uid);let t=0;if(m)for(const r of m.values())t=Math.max(t,r.doneAt);for(const a of attempts)if(a.userId===uid)t=Math.max(t,a.at);return t};
  const ring=(v,label,sub)=>`<div class="tile tile-ring"><div class="ring ${v===100?'full':''}" style="--p:${v||0}" data-v="${v==null?'—':v+'%'}"></div><span>${label}${sub?`<small>${sub}</small>`:''}</span></div>`;
  const tile=(n,label,cls='',sub)=>`<div class="tile ${cls}"><b>${n}</b><span>${label}</span>${sub?`<small>${sub}</small>`:''}</div>`;
  /* Performance figures: overall, or for one calendar month */
  const ymOf=t=>{const d=new Date(t*1000);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`};
  const thisMonth=ymOf(nowS());if(!ui.perfMonth)ui.perfMonth=thisMonth;
  const stamps=[nowS()];for(const p of pairs){if(p.s.due)stamps.push(p.s.due);if(p.s.done)stamps.push(p.s.at)}
  for(const a of attempts)if(pairs.some(p=>p.u.id===a.userId&&p.c.id===a.courseId))stamps.push(a.at);
  const months=[];{const lo=new Date(Math.min(...stamps)*1000),hi=new Date(Math.max(...stamps)*1000),d=new Date(hi.getFullYear(),hi.getMonth(),1);
    while(d>=new Date(lo.getFullYear(),lo.getMonth(),1)&&months.length<60){months.push(ymOf(d/1000));d.setMonth(d.getMonth()-1)}}
  if(!months.includes(ui.perfMonth))ui.perfMonth=months.includes(thisMonth)?thisMonth:months[0];
  const monthly=ui.perfMode==='month',[py,pm]=ui.perfMonth.split('-').map(Number),range=[new Date(py,pm-1,1)/1000,new Date(py,pm,1)/1000];
  const monthName=ym=>{const [y,m]=ym.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'})};
  const inR=t=>t&&t>=range[0]&&t<range[1];
  let P;
  if(!monthly)P={avg,score:teamScore,done:cnt.done,late:cnt.late,overdue:cnt.overdue};
  else{const due=pairs.filter(p=>inR(p.s.due)),bests=[];
    for(const p of pairs){const at=attempts.filter(a=>a.userId===p.u.id&&a.courseId===p.c.id&&inR(a.at));if(at.length)bests.push(Math.max(...at.map(a=>a.pct)))}
    P={avg:due.length?Math.round(due.reduce((a,p)=>a+learnerPct(p.u.id,p.c),0)/due.length):null,score:bests.length?Math.round(bests.reduce((a,b)=>a+b,0)/bests.length):null,
      done:pairs.filter(p=>p.s.key==='done'&&inR(p.s.at)).length,late:pairs.filter(p=>p.s.key==='late'&&inR(p.s.at)).length,overdue:pairs.filter(p=>p.s.key==='overdue'&&inR(p.s.due)).length}}
  const mi=months.indexOf(ui.perfMonth);
  const mineMods=isTrainer()?courses.map(c=>({c,s:trainerState(me.id,c),a:assignOf(me.id,c)})):[];
  $('#app').innerHTML=`
    <div class="hero"><div><h1>Dashboard</h1><p>${isAdmin()?'Progress, deadlines and test results across every course, learner and trainer.':'Progress, deadlines and test results for the learners on your modules.'}</p></div>
      ${depts.length>1?`<div class="right"><select class="input" id="ddep" aria-label="Department"><option value="">All departments</option>${depts.map(x=>`<option value="${x.id}" ${String(ui.dashDept)===String(x.id)?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div>`:''}</div>
    <div class="tiles">
      ${tile(L.length,'Learners')}${isAdmin()?tile(trainers().length,'Trainers'):''}${tile(courses.length,isAdmin()?'Courses':'My modules')}${tile(pendingTests,'Tests not yet passed')}
    </div>
    <div class="perf-bar">
      <h3>Performance</h3>
      <div class="seg" role="tablist" aria-label="Period"><button role="tab" aria-selected="${!monthly}" class="${monthly?'':'on'}" data-act="perfMode" data-p="all">Overall</button><button role="tab" aria-selected="${monthly}" class="${monthly?'on':''}" data-act="perfMode" data-p="month">Monthly</button></div>
      ${monthly?`<div class="month-nav"><button class="icon-btn" data-act="perfMonth" data-month="${months[mi+1]||''}" ${mi>=months.length-1?'disabled':''} aria-label="Previous month">${I.left}</button>
        <select class="input" id="pmonth" aria-label="Month">${months.map(m=>`<option value="${m}" ${m===ui.perfMonth?'selected':''}>${monthName(m)}${m===thisMonth?' (this month)':''}</option>`).join('')}</select>
        <button class="icon-btn" data-act="perfMonth" data-month="${months[mi-1]||''}" ${mi<=0?'disabled':''} aria-label="Next month">${I.chev}</button></div>`:''}
    </div>
    <div class="tiles perf-tiles">
      ${ring(P.avg,'Average<br>completion',monthly?'Courses due this month':'')}${ring(P.score,'Average<br>test score',monthly?'Tests taken this month':'')}
      ${tile(P.done,'Completed on time','t-ok',monthly?'Completed this month':'')}${tile(P.late,'Delayed completion','t-warn',monthly?'Completed this month':'')}${tile(P.overdue,'Delayed incompletion','t-bad',monthly?'Due this month, still open':'')}
    </div>
    ${isTrainer()?`<div class="section"><div class="section-head"><h2>My modules</h2><span class="count">Your training deadlines</span></div>
      ${mineMods.length?`<div class="panel rows">${mineMods.map(({c,s,a})=>`<div class="row click" data-go="#/course/${c.id}#learners">${thumb(c)}
        <div class="who"><b>${esc(c.title)}</b><span>${esc(a&&a.due?(s.done?`Completed ${fmtDue(s.at)}`:dueText(a.due)):'No training deadline')} · ${s.n} of ${s.total} learners done · avg test ${scoreText(avgOfBest(enrolled(c),c))}</span></div>
        ${stPill(s.key)}<span class="row-chev">${I.chev}</span></div>`).join('')}</div>`:'<div class="panel empty" style="padding:40px"><p>No modules assigned to you yet.</p></div>'}</div>`:''}
    <div class="section"><div class="section-head"><h2>By course</h2></div>
      ${courses.length?`<div class="panel rows">${courses.map(c=>{const E=enrolled(c),cs=countStates(E.map(u=>courseState(u.id,c))),tp=teamPct(c);
        const tr=c.trainerIds.map(userById).filter(Boolean);
        return`<div class="row click" data-go="#/course/${c.id}#learners">${thumb(c)}
          <div class="who"><b>${esc(c.title)}</b><span>${plural(E.length,'learner')} · avg test ${scoreText(avgOfBest(E,c))}${hasTest(c)?'':' · <span style="color:var(--orange)">No test</span>'}${isAdmin()?` · ${tr.length?tr.map(t=>`${esc(t.name)} ${stPill(trainerState(t.id,c).key)}`).join(', '):'<span style="color:var(--orange)">No trainer</span>'}`:''}</span>
            <div class="chips">${stateChips(cs)}</div></div>
          <div class="prog">${bar(tp)}<span class="pct">${tp}%</span></div><span class="row-chev">${I.chev}</span></div>`}).join('')}</div>`
      :`<div class="panel empty" style="padding:40px"><p>${isAdmin()?'No courses yet.':'No modules assigned to you yet.'}</p></div>`}
    </div>
    ${isAdmin()?`<div class="section"><div class="section-head"><h2>Trainers</h2></div>
      ${trainers().length?`<div class="panel rows">${trainers().map(t=>{const mods=courses.filter(c=>c.trainerIds.includes(t.id)),st=mods.map(c=>trainerState(t.id,c)),o=countStates(st);
        return`<div class="row click" data-go="#/learner/${t.id}">${avatar(t)}<div class="who"><b>${esc(t.name)}</b><span>${esc(t.designation)} · ${plural(mods.length,'module')}</span>
          <div class="chips">${mods.map((c,i)=>`<span class="pill">${esc(c.title)}</span>${stPill(st[i].key)}`).join(' ')||'<span class="pill" style="color:var(--orange)">No modules assigned</span>'}</div></div>
          <span class="small">${o.overdue?`<b style="color:var(--red)">${o.overdue} overdue</b>`:''}</span><span class="row-chev">${I.chev}</span></div>`}).join('')}</div>`:'<div class="panel empty" style="padding:30px"><p>No trainers yet.</p></div>'}</div>`:''}
    <div class="section"><div class="section-head"><h2>Learners</h2><span class="count">Overall performance is the average of each learner’s best test scores</span></div>
      <div class="toolbar">
        <input class="input search-in" id="dq" placeholder="Search by name" value="${esc(ui.dashQ)}">
        <select class="input" id="dc"><option value="">All ${isAdmin()?'courses':'modules'}</option>${courses.map(c=>`<option value="${c.id}" ${+ui.dashCourse===c.id?'selected':''}>${esc(c.title)}</option>`).join('')}</select>
        <select class="input" id="ds"><option value="">Any status</option>${['overdue','late','progress','todo','done'].map(k=>`<option value="${k}" ${ui.dashStatus===k?'selected':''}>${ST[k][0]}</option>`).join('')}</select>
        ${desigs.length>1?`<select class="input" id="dd"><option value="">All designations</option>${desigs.map(d=>`<option ${ui.dashDesig===d?'selected':''}>${esc(d)}</option>`).join('')}</select>`:''}
        <select class="input" id="dsort">${[['attention','Needs attention first'],['score','Best test performance'],['progress','Most progress'],['name','Name']].map(([v,l])=>`<option value="${v}" ${ui.dashSort===v?'selected':''}>${l}</option>`).join('')}</select>
      </div>
      <div class="panel rows" id="drows"></div>
    </div>`;
  const draw=()=>{
    const q=ui.dashQ.toLowerCase(),fc=courses.find(c=>c.id===+ui.dashCourse);
    const rows=L.filter(u=>(!q||u.name.toLowerCase().includes(q))&&(!ui.dashDesig||u.designation===ui.dashDesig)&&(!fc||isEnrolled(u.id,fc))).map(u=>{
      const sc=(fc?[fc]:courses).filter(c=>isEnrolled(u.id,c)),st=sc.map(c=>courseState(u.id,c)),o=countStates(st);
      const p=sc.length?Math.round(sc.reduce((a,c)=>a+learnerPct(u.id,c),0)/sc.length):0,score=avgScore(u.id,sc);
      const nextDue=st.filter(s=>!s.done&&s.due).map(s=>s.due).sort((a,b)=>a-b)[0]||0;
      return{u,sc,st,o,p,score,nextDue,t:lastAct(u.id)}}).filter(r=>!ui.dashStatus||r.o[ui.dashStatus]>0);
    const sorters={attention:(a,b)=>b.o.overdue-a.o.overdue||(a.nextDue||9e12)-(b.nextDue||9e12)||a.u.name.localeCompare(b.u.name),
      score:(a,b)=>(b.score??-1)-(a.score??-1)||a.u.name.localeCompare(b.u.name),progress:(a,b)=>b.p-a.p,name:(a,b)=>a.u.name.localeCompare(b.u.name)};
    rows.sort(sorters[ui.dashSort]||sorters.attention);
    $('#drows').innerHTML=rows.map(({u,sc,o,p,score,nextDue,t})=>`<div class="row click" data-go="#/learner/${u.id}${fc?'/'+fc.id:''}">${avatar(u)}
      <div class="who"><b>${esc(u.name)}</b><span>${esc(u.designation)} · ${sc.length?`${o.done+o.late}/${sc.length} complete${nextDue?` · next ${esc(dueText(nextDue))}`:''}`:'<span style="color:var(--orange)">No courses assigned</span>'}</span>
        <div class="chips">${stateChips(o)}</div></div>
      <div class="perf" title="Overall test performance"><b>${scoreText(score)}</b><span>tests</span></div>
      <span class="small">${ago(t)}</span>
      <div class="prog">${bar(p)}<span class="pct">${p}%</span></div><span class="row-chev">${I.chev}</span></div>`).join('')
      ||`<div class="empty" style="padding:36px"><p>${L.length?'No learners match these filters.':'No learners are assigned yet.'}</p></div>`;
  };
  draw();
  $('#dq').oninput=e=>{ui.dashQ=e.target.value;draw()};
  if($('#pmonth'))$('#pmonth').onchange=e=>{ui.perfMonth=e.target.value;viewDashboard()};
  if($('#ddep'))$('#ddep').onchange=e=>{ui.dashDept=e.target.value;ui.dashCourse='';viewDashboard()};
  $('#dc').onchange=e=>{ui.dashCourse=e.target.value;draw()};
  $('#ds').onchange=e=>{ui.dashStatus=e.target.value;draw()};
  $('#dsort').onchange=e=>{ui.dashSort=e.target.value;draw()};
  if($('#dd'))$('#dd').onchange=e=>{ui.dashDesig=e.target.value;draw()};
}

function assignSheet(u,c){
  const a=assignOf(u.id,c),due=(a&&a.due)||defaultDue();
  sheet({title:a?`Deadlines · ${c.title}`:`Assign ${c.title}`,submit:a?'Save deadlines':'Assign',
    fields:`<p class="sheet-note">${roleLabel[u.role]}: <b>${esc(u.name)}</b>${u.email?` · ${esc(u.email)}`:''}</p>
      <div class="field"><label>${u.role==='trainer'?'Train assigned learners by':'Complete the course by'}</label><input type="datetime-local" name="due" value="${toLocalInput(due)}"></div>
      ${c.chapters.length?`<details class="ch-dl" ${a&&Object.values(a.chapters||{}).some(Boolean)?'open':''}><summary>Chapter deadlines (optional)</summary>
        ${c.chapters.map(ch=>{const x=a&&a.chapters&&a.chapters[ch.id];return`<label class="ch-dl-row"><span>${esc(ch.title)}</span><input type="datetime-local" name="ch_${ch.id}" value="${toLocalInput(x&&x.due)}"></label>`}).join('')}
        <div class="hint">Chapters without their own deadline use the course deadline. Clear a date to remove it.</div></details>`:''}
      <div class="hint cal-hint">${calendarOn?(u.email?`${I.check} A Google Calendar invite goes to ${esc(u.email)} for each deadline.`:'Add an email address for this person to send calendar invites.'):'Google Calendar isn’t connected, so no invite is sent automatically. They can add each deadline to their calendar from their IRRLearning home page.'}</div>`,
    onSave:async d=>{const due=fromLocalInput(d.due);if(!due)throw new Error('Choose a deadline date and time.');
      const chapters={};for(const ch of c.chapters){const k='ch_'+ch.id;if(!(k in d))continue;const v=fromLocalInput(d[k]),had=a&&a.chapters&&a.chapters[ch.id];if(v||had)chapters[ch.id]=v||null}
      const r=await api('POST','assign',{courseId:c.id,userId:u.id,on:true,due,chapters});
      toast(r.calendar==='sent'?'Saved and added to their Google Calendar':r.calendar==='pending'?'Saved. The calendar invite is on its way':r.calendar==='failed'?'Saved, but the calendar invite failed. Try again later.':'Saved')}});
}
function unassignSheet(u,c){confirmSheet(`Remove ${u.name} from ${c.title}?`,`The course disappears from their list and its deadlines and calendar events are removed. Their progress is kept.`,
  async()=>{await api('POST','assign',{courseId:c.id,userId:u.id,on:false});toast('Removed')},'Remove')}
function assignPeopleSheet(c){
  const item=u=>{const a=assignOf(u.id,c);return[u.id,u.name,[u.designation,a&&a.due?'due '+fmtDue(a.due):''].filter(Boolean).join(' · ')]};
  const curL=c.learnerIds||[],curT=c.trainerIds||[];
  sheet({title:`Assign people · ${c.title}`,submit:'Save',
    fields:`<div class="field"><label>Deadline for people you add</label><input type="datetime-local" name="due" value="${toLocalInput(defaultDue())}"></div>
      <label class="check-line"><input type="checkbox" name="applyAll"> Also set this deadline for everyone already assigned</label>
      <div class="field"><label>Learners</label>${checklist('learner',learners().map(item),curL,'No learners have registered yet.',true)}</div>
      <div class="field"><label>Trainers <span class="lbl-note">· pick as many as you need</span></label>${checklist('trainer',trainers().map(item),curT,'No trainer accounts yet.',true)}
        <div class="hint trainer-hint">${trainers().length<2?`${trainers().length?'Only one person has':'Nobody has'} a Trainer account so far. `:''}Only people with a Trainer account appear here. <button type="button" class="link-btn" data-act="newTrainer">Add a trainer</button> or change someone’s account type in People.</div></div>
      <div class="hint">${calendarOn?'Everyone with a deadline gets a Google Calendar invite. Set chapter deadlines from a person’s page.':'Google Calendar isn’t connected, so no invites are sent. Set chapter deadlines from a person’s page.'}</div>`,
    onSave:async d=>{const due=fromLocalInput(d.due),all=!!d.applyAll;
      const want={learner:new Set(d._all('learner').map(Number)),trainer:new Set(d._all('trainer').map(Number))};
      const cur={learner:new Set(curL),trainer:new Set(curT)};let added=0,removed=0,updated=0,failed=0;
      const needsDue=[...want.learner,...want.trainer].some(id=>!cur.learner.has(id)&&!cur.trainer.has(id))||all;
      if(needsDue&&!due)throw new Error('Choose a deadline date and time.');
      for(const role of ['learner','trainer'])for(const u of (role==='learner'?learners():trainers())){
        const w=want[role].has(u.id),h=cur[role].has(u.id);
        if(w&&(!h||all)){const r=await api('POST','assign',{courseId:c.id,userId:u.id,on:true,due});h?updated++:added++;if(r.calendar==='failed')failed++}
        else if(!w&&h){await api('POST','assign',{courseId:c.id,userId:u.id,on:false});removed++}}
      toast([added&&`${added} added`,updated&&`${updated} updated`,removed&&`${removed} removed`,failed&&`${failed} calendar invite${failed>1?'s':''} failed`].filter(Boolean).join(' · ')||'No changes')}});
}

const BLOCK_TYPES=[['p','Text','Aa'],['h2','Heading','H1'],['h3','Subheading','H2'],['ul','Bulleted list','•'],['ol','Numbered list','1.'],['quote','Quote or tip','❝'],['img','Image','▣'],['video','Video','▶'],['hr','Divider','—']];
const BLOCK_LABEL=Object.fromEntries(BLOCK_TYPES.map(([t,l])=>[t,l]));
function cleanHtml(html){
  const doc=new DOMParser().parseFromString('<div>'+String(html||'')+'</div>','text/html');
  const walk=n=>{let out='';for(const c of n.childNodes){
    if(c.nodeType===3){out+=esc(c.textContent);continue}
    if(c.nodeType!==1)continue;
    const t=c.tagName.toLowerCase(),inner=walk(c);
    if(t==='b'||t==='strong')out+=inner?`<b>${inner}</b>`:'';
    else if(t==='i'||t==='em')out+=inner?`<i>${inner}</i>`:'';
    else if(t==='u')out+=inner?`<u>${inner}</u>`:'';
    else if(t==='a'){const h=c.getAttribute('href')||'';out+=/^https?:\/\//i.test(h)?`<a href="${esc(h)}" target="_blank" rel="noopener">${inner}</a>`:inner}
    else if(t==='br')out+='<br>';
    else if(t==='div'||t==='p')out+=(out&&!out.endsWith('<br>')?'<br>':'')+inner;
    else if(t==='span'&&/font-weight:\s*(bold|[6-9]00)/.test(c.getAttribute('style')||''))out+=inner?`<b>${inner}</b>`:'';
    else if(t==='span'&&/font-style:\s*italic/.test(c.getAttribute('style')||''))out+=inner?`<i>${inner}</i>`:'';
    else out+=inner}
    return out};
  return walk(doc.body.firstChild).replace(/(<br>)+$/,'');
}
const plainOf=html=>{const d=document.createElement('div');d.innerHTML=cleanHtml(html);return d.textContent.trim()};
function mdToBlocks(src){
  if(!src||!src.trim())return[];
  if(/^\s*</.test(src))return[{t:'p',html:cleanHtml(src)}];
  const inline=s=>cleanHtml(esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/\[(.+?)\]\((https?:[^)\s]+)\)/g,'<a href="$2">$1</a>'));
  const out=[];let list=null;
  for(const raw of src.split('\n')){const line=raw.trimEnd();let m;
    const li=line.match(/^\s*[-*]\s+(.*)/),ol=line.match(/^\s*\d+\.\s+(.*)/);
    if(li||ol){const t=li?'ul':'ol';if(!list||list.t!==t){list={t,items:[]};out.push(list)}list.items.push(inline((li||ol)[1]));continue}
    list=null;if(!line.trim())continue;
    if(m=line.match(/^###\s+(.*)/))out.push({t:'h3',text:m[1]});
    else if(m=line.match(/^#{1,2}\s+(.*)/))out.push({t:'h2',text:m[1]});
    else if(m=line.match(/^>\s?(.*)/))out.push({t:'quote',html:inline(m[1])});
    else if(m=line.match(/^!\[(.*?)\]\((\S+?)\)/))out.push({t:'img',src:m[2],caption:m[1]});
    else out.push({t:'p',html:inline(line)});
  }
  return out;
}
function lessonBlocks(l){
  if(l.blocks&&l.blocks.length)return l.blocks;
  const b=mdToBlocks(l.content||'');
  if(l.video)b.unshift({t:'video',url:l.video});
  return b;
}
const safeSrc=u=>/^(https:\/\/|\/uploads\/|\/_blob\/|data:image\/)/i.test(String(u||''))?u:'';
function mediaEmbed(b){
  if(b.src&&safeSrc(b.src)&&!/^data:/.test(b.src))return`<div class="video"><video src="${esc(b.src)}" controls playsinline preload="metadata"></video></div>`;
  const e=embed(b.url||'');
  return e.startsWith('<a')?e:`<div class="video">${e}</div>`;
}
function renderBlocks(bs){
  return bs.map(b=>{switch(b.t){
    case'h2':return b.text?`<h2>${esc(b.text)}</h2>`:'';
    case'h3':return b.text?`<h3>${esc(b.text)}</h3>`:'';
    case'p':return plainOf(b.html)?`<p>${cleanHtml(b.html)}</p>`:'';
    case'ul':case'ol':{const it=(b.items||[]).filter(x=>plainOf(x));return it.length?`<${b.t}>${it.map(x=>`<li>${cleanHtml(x)}</li>`).join('')}</${b.t}>`:''}
    case'quote':return plainOf(b.html)?`<blockquote>${cleanHtml(b.html)}</blockquote>`:'';
    case'img':return safeSrc(b.src)?`<figure><img src="${esc(b.src)}" alt="${esc(b.caption||'')}" loading="lazy">${b.caption?`<figcaption>${esc(b.caption)}</figcaption>`:''}</figure>`:'';
    case'video':return b.src||b.url?`<figure>${mediaEmbed(b)}${b.caption?`<figcaption>${esc(b.caption)}</figcaption>`:''}</figure>`:'';
    case'hr':return'<hr>';
  }return''}).join('');
}
function shrinkBlob(file,max,q){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size<400*1024)return Promise.resolve(file);
  return new Promise((res)=>{const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(url);cv.toBlob(b=>res(b&&b.size<file.size?b:file),'image/jpeg',q)};
    im.onerror=()=>{URL.revokeObjectURL(url);res(file)};im.src=url});
}
const blobToDataURL=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});
/* UPLOAD-START */
const UPLOAD_NOTE='Video files (MP4) up to 50 MB. For longer videos, paste a YouTube or Vimeo link.';
async function uploadMedia(file,kind){
  const blob=kind==='img'?await shrinkBlob(file,1600,.82):file;
  if(localMode){if(kind!=='img')throw new Error('Video uploads need the database connected.');return await blobToDataURL(blob)}
  if(blob.size>50*1024*1024)throw new Error(kind==='img'?'That image is over 50 MB.':'That video is over 50 MB. Trim it, or put it on YouTube or Vimeo and paste the link instead.');
  const type=blob.type||file.type,ext={'image/jpeg':'jpg','image/png':'png','image/gif':'gif','image/webp':'webp','video/mp4':'mp4','video/quicktime':'mov','video/webm':'webm'}[type]||'bin';
  const path=`${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const{error}=await sb.storage.from('uploads').upload(path,blob,{contentType:type});
  if(error)throw new Error('The upload failed: '+(error.message||'please try again.'));
  return sb.storage.from('uploads').getPublicUrl(path).data.publicUrl;
}

function edCollect(){
  if(!ed||!$('#edTitle'))return;
  ed.title=$('#edTitle').value.replace(/\s+/g,' ').trim();ed.minutes=$('#edMin').value;
  document.querySelectorAll('#edBlocks .blk').forEach(el=>{const b=ed.blocks[+el.dataset.i];if(!b)return;
    el.querySelectorAll('[data-f]').forEach(f=>{const k=f.dataset.f;
      if(k==='html')b.html=cleanHtml(f.innerHTML);
      else if(k==='text'||k==='caption')b[k]=f.innerText.replace(/\s+/g,' ').trim();
      else if(k==='items'){const lis=[...f.querySelectorAll('li')];b.items=lis.length?lis.map(li=>cleanHtml(li.innerHTML)):f.innerText.split('\n').map(esc)}})});
}

  el.focus();if(!el.isContentEditable)return;

}

function edKey(e){

/* ================= Sheets ================= */
function sheet({title,fields,submit='Save',onSave,danger,red}){
  const o=document.createElement('div');o.className='overlay';
  o.innerHTML=`<form class="sheet" novalidate><div class="sheet-head"><h3>${esc(title)}</h3></div>
    <div class="sheet-body">${fields||''}<div class="err" style="text-align:left" data-err></div></div>
    <div class="sheet-foot">${danger?`<button type="button" class="btn btn-danger" data-x="danger" style="margin-right:auto">${esc(danger.label)}</button>`:''}
      <button type="button" class="btn btn-gray" data-x="cancel">Cancel</button><button class="btn ${red?'btn-red':'btn-primary'}">${esc(submit)}</button></div></form>`;
  document.body.appendChild(o);
  const close=()=>{o.remove();document.removeEventListener('keydown',onKey)};
  const onKey=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',onKey);
  o.addEventListener('mousedown',e=>{if(e.target===o)close()});
  o.querySelector('[data-x=cancel]').onclick=close;
  if(danger)o.querySelector('[data-x=danger]').onclick=()=>{close();danger.fn()};
  const f=o.querySelector('form');wirePins(f);
  f.onsubmit=async e=>{e.preventDefault();const btn=f.querySelector('.sheet-foot .btn:last-child');btn.disabled=true;f.querySelector('[data-err]').textContent='';
    try{const d=Object.fromEntries(new FormData(f));d._all=n=>new FormData(f).getAll(n);await onSave(d,f);close();await refresh();render()}
    catch(ex){f.querySelector('[data-err]').textContent=ex.message;btn.disabled=false}};
  f.querySelector('input:not([type=file]):not([type=checkbox]):not([type=radio]),textarea')?.focus();
  return f;
}
const field=(name,label,val='',o={})=>`<div class="field"><label>${label}</label>${o.area?`<textarea name="${name}" placeholder="${esc(o.ph||'')}" ${o.tall?'style="min-height:240px"':''}>${esc(val)}</textarea>`:`<input name="${name}" type="${o.type||'text'}" value="${esc(val)}" placeholder="${esc(o.ph||'')}" ${o.type==='number'?'min="0" step="any"':''}>`}${o.hint?`<div class="hint">${o.hint}</div>`:''}</div>`;
const req=(v,msg)=>{if(!String(v||'').trim())throw new Error(msg)};
function confirmSheet(title,msg,fn,btn='Delete'){sheet({title,fields:`<p style="color:var(--text-2);font-size:15px">${msg}</p>`,submit:btn,red:true,onSave:fn})}
const checklist=(name,items,sel,empty,all)=>`<div class="checklist">${all&&items.length>1?`<div class="cl-head"><span>${items.length} available</span><button type="button" class="btn btn-ghost btn-sm" data-act="checkAll">${items.every(i=>sel.includes(i[0]))?'Clear all':'Select all'}</button></div>`:''}${items.map(([v,l,sub])=>`<label><input type="checkbox" name="${name}" value="${v}" ${sel.includes(v)?'checked':''}><span>${esc(l)}${sub?` <span style="color:var(--text-3);font-size:13px">· ${esc(sub)}</span>`:''}</span></label>`).join('')||`<div class="none">${empty}</div>`}</div>`;

      const body={title:d.title,desc:d.desc,status:d.status,category_id:+d.cat,color,image:img,mandatory:!!d.mandatory,valid_months:+d.valid_months||0};
      if(course)await api('PUT','courses/'+course.id,body);else await api('POST','courses',body);
      toast(course?'Course saved':'Course created')}});
  const prev=()=>{f.querySelector('#ip').style.cssText=coverStyle({image:img,color});f.querySelectorAll('.sw').forEach(s=>s.classList.toggle('on',s.dataset.c===color&&!img))};
  f.querySelectorAll('.sw').forEach(s=>s.onclick=()=>{color=s.dataset.c;img='';prev()});

function shrink(file,max=800){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{
  const s=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*s;cv.height=im.height*s;
  cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);r(cv.toDataURL('image/jpeg',.75))};im.src=fr.result};fr.readAsDataURL(file)})}

      case'editCat':{const cat=cats.find(x=>x.id===+d.id);return sheet({title:'Edit category',fields:field('title','Category name',cat.title)+`<div class="field"><label>Department</label><select name="dept">${depts.map(x=>`<option value="${x.id}" ${x.id===cat.departmentId?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div>`,
        onSave:async x=>{req(x.title,'Please enter a name.');await api('PUT','categories/'+cat.id,{title:x.title,department_id:+x.dept})}})}
      case'delCat':{const cat=cats.find(x=>x.id===+d.id);return confirmSheet('Delete category?',`“${esc(cat.title)}” and its ${plural(cat.courses.length,'course')} will be removed, including all progress.`,()=>api('DELETE','categories/'+cat.id))}
      case'moveCat':return act(()=>api('POST',`categories/${d.id}/move`,{dir:+d.dir}));
      case'moveCourse':return act(()=>api('POST',`courses/${d.id}/move`,{dir:+d.dir}));
      case'move':return act(()=>api('POST',`${d.t}/${d.id}/move`,{dir:+d.dir}));
      case'newCourse':return courseSheet(null,+d.cat);
      case'editCourse':return courseSheet(find(+d.id).course);
      case'newCh':return chapterSheet(+d.c,d.index!=null?+d.index:null,d.then==='lesson');
      case'newLAt':{const go=()=>lessonSheet(+d.ch,null,+d.c,d.index!=null?+d.index:null);if(ed&&isEditRoute()){edCollect();edSave().then(go)}else go();return}
      case'newChAt':{const go=()=>chapterSheet(+d.c,d.index!=null?+d.index:null,true);if(ed&&isEditRoute()){edCollect();edSave().then(go)}else go();return}
      case'editCh':{const ch=find(+d.c).course.chapters.find(x=>x.id===+d.id);return sheet({title:'Rename chapter',fields:field('title','Chapter title',ch.title),onSave:async x=>{req(x.title,'Please enter a title.');await api('PUT','chapters/'+ch.id,{title:x.title})}})}
      case'delCh':{const ch=find(+d.c).course.chapters.find(x=>x.id===+d.id);return confirmSheet('Delete chapter?',`“${esc(ch.title)}” and its ${plural(ch.lessons.length,'lesson')} will be removed.`,()=>api('DELETE','chapters/'+ch.id))}
      case'newL':return lessonSheet(+d.ch,null,+d.c);
      case'editL':{const ch=find(+d.c).course.chapters.find(x=>x.id===+d.ch);return lessonSheet(ch.id,ch.lessons.find(x=>x.id===+d.id),+d.c)}
      case'delL':return delLesson(+d.id,d.title);
      case'toggleMine':{const id=+d.id,on=!mine.has(id);setMine(id,on);render();
        try{await api('POST','progress',{lessonId:id,done:on})}catch(ex){setMine(id,!on);render();toast(ex.message)}return}
      case'completeNext':{const id=+d.id,cc=allCourses().find(x=>allLessons(x).some(l=>l.id===id));if(!mine.has(id)){setMine(id,true);api('POST','progress',{lessonId:id,done:true}).then(()=>toast('Lesson complete')).catch(ex=>{setMine(id,false);toast(ex.message)})}location.hash=d.next;maybeAskFeedback(cc);return}
      case'signoff':{const uid=+d.u,id=+d.id,on=d.done!=='1';
        if(!team.byUser.has(uid))team.byUser.set(uid,new Map());const mm=team.byUser.get(uid);
        const prev=mm.get(id);on?mm.set(id,{userId:uid,lessonId:id,doneAt:Date.now()/1000,signedBy:me.id}):mm.delete(id);
        const open=[...document.querySelectorAll('.chapter.open [data-toggle]')].map(x=>x.dataset.toggle);render();
        document.querySelectorAll('[data-toggle]').forEach(x=>{if(open.includes(x.dataset.toggle))x.parentElement.classList.add('open')});
        try{await api('POST','progress',{lessonId:id,userId:uid,done:on})}catch(ex){prev?mm.set(id,prev):mm.delete(id);render();toast(ex.message)}return}
      case'scrollLearners':return $('#learners')?.scrollIntoView({behavior:'smooth'});
      case'checkAll':{const cbs=[...a.closest('.checklist').querySelectorAll('input[type=checkbox]')],allOn=cbs.every(x=>x.checked);cbs.forEach(x=>x.checked=!allOn);a.textContent=allOn?'Select all':'Clear all';return}
      case'assignSwitch':{const c=find(+d.c).course,u=userById(+d.u);return d.on==='1'?assignSheet(u,c):unassignSheet(u,c)}
      case'assignEdit':return assignSheet(userById(+d.u),find(+d.c).course);
      case'assignPeople':return assignPeopleSheet(find(+d.id).course);
      case'assignTest':{const on=d.on==='1',kind=d.kind==='retest'?'retest':'test';return act(()=>api('POST',`tests/${d.c}/assign`,{userId:+d.u,on,kind}),on?(kind==='retest'?'Retest assigned. It’s now on their home page.':'Test assigned. It’s now on their home page.'):'Withdrawn')}
      case'submitTest':{const c=find(+d.c).course,qs=c.test.questions,left=qs.filter((_,i)=>testState.answers[i]==null).length;
        if(left)return toast(`Answer every question first (${plural(left,'question')} left)`);a.disabled=true;
        try{testState.result=await api('POST',`tests/${c.id}/attempt`,{answers:qs.map((_,i)=>testState.answers[i])});await refresh();render();scrollTo(0,0);if(testState.result.passed)maybeAskFeedback(find(c.id).course)}catch(ex){a.disabled=false;toast(ex.message)}return}
      case'retakeTest':testState.answers=[];testState.result=null;render();scrollTo(0,0);return;
      case'tqAdd':tCollect();tEd.questions.push({q:'',options:['',''],answer:0});tEd.dirty=true;render();setTimeout(()=>{const t=[...document.querySelectorAll('[data-tq]')].pop();t&&(t.focus(),t.scrollIntoView({block:'center'}))},0);return;
      case'tqDel':tCollect();tEd.questions.splice(+d.i,1);tEd.dirty=true;render();return;
      case'tqMove':{tCollect();const i=+d.i,j=i+(+d.dir),q=tEd.questions;if(j<0||j>=q.length)return;[q[i],q[j]]=[q[j],q[i]];tEd.dirty=true;render();return}
      case'toAdd':tCollect();tEd.questions[+d.i].options.push('');tEd.dirty=true;render();return;
      case'toDel':{tCollect();const q=tEd.questions[+d.i],j=+d.j;q.options.splice(j,1);if(q.answer>=j&&q.answer>0)q.answer--;tEd.dirty=true;render();return}
      case'saveTest':{tCollect();const cid=tEd.cid;a.disabled=true;
        try{await api('PUT','tests/'+cid,{passMark:tEd.passMark,questions:tEd.questions});tEd=null;await refresh();toast('Test saved');location.hash='#/course/'+cid}catch(ex){a.disabled=false;toast(ex.message)}return}
      case'edIns':return $('#insMenu')?closeIns():openIns(a,+d.i);
      case'edAdd':{closeIns();edCollect();if(ed.blocks.length>=MAX_BLOCKS)return toast(`A lesson can have up to ${MAX_BLOCKS} blocks.`);
        const i=+d.i+1;ed.blocks.splice(i,0,newBlock(d.t));edRender(i,true);edChanged();
        if(d.t==='video')setTimeout(()=>document.querySelector(`[data-vurl="${i}"]`)?.focus(),0);return}
      case'edMove':{edCollect();const i=+d.i,j=i+(+d.dir);if(j<0||j>=ed.blocks.length)return;[ed.blocks[i],ed.blocks[j]]=[ed.blocks[j],ed.blocks[i]];edRender();edChanged();return}
      case'edDel':{edCollect();ed.blocks.splice(+d.i,1);if(!ed.blocks.length)ed.blocks.push(newBlock('p'));edRender();edChanged();return}
      case'edVidUrl':{const inp=document.querySelector(`[data-vurl="${d.i}"]`),v=(inp?.value||'').trim();
        if(!/^https?:\/\/\S+$/i.test(v))return toast('Paste a full link starting with https://');edCollect();Object.assign(ed.blocks[+d.i],{url:v,src:''});edRender();edChanged();return}
      case'edVidReset':{edCollect();Object.assign(ed.blocks[+d.i],{url:'',src:''});edRender();edChanged();return}
      case'perfMode':ui.perfMode=d.p;return viewDashboard();
      case'perfMonth':if(d.month){ui.perfMonth=d.month;viewDashboard()}return;
      case'noop':return;
      case'go':location.hash=d.href;return;
      case'rateCourse':return feedbackSheet(find(+d.c).course);
      case'insJump':document.getElementById(d.k)?.scrollIntoView({behavior:'smooth'});return;
      case'rateTeam':return rateTeamSheet();
      case'editPath':return pathSheet(d.d);
      case'newPerson':return personSheet(null);
      case'newTrainer':a.closest('.overlay')?.remove();return personSheet(null,'trainer');
      case'editPerson':return personSheet(userById(+d.id));
      case'delPerson':return delPerson(userById(+d.id));
    }return}
  const t=e.target.closest('[data-toggle]');
  if(t){const id=t.dataset.toggle,el=t.parentElement;
    if(!openChapters.size)document.querySelectorAll('.chapter.open [data-toggle]').forEach(x=>openChapters.add(isNaN(x.dataset.toggle)?x.dataset.toggle:+x.dataset.toggle));
    el.classList.toggle('open');const key=isNaN(id)?id:+id;el.classList.contains('open')?openChapters.add(key):openChapters.delete(key);return}
  const g=e.target.closest('[data-go]');if(g&&!e.target.closest('a[target=_blank]')){e.preventDefault();location.hash=g.dataset.go}
});
function toast(m){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
let lastView='';
addEventListener('hashchange',()=>{closeCtx();flushTrack();if(location.hash.startsWith('#/insights'))ins=null;if(!location.hash.startsWith('#/test-edit/'))tEd=null;if(!location.hash.startsWith('#/test/'))testState=null;if(ed&&!isEditRoute()){edCollect();const e=ed;ed=null;const fb=$('#fmtBar');if(fb)fb.hidden=true;closeIns();if(e.dirty)edSave(e).then(ok=>{if(ok&&me)render()})}const v=location.hash.split('/').slice(0,3).join('/');if(v!==lastView)openChapters.clear();lastView=v;if(me)render()});

/* ================= Boot ================= */
function takeDeepLink(){const m=location.hash.match(/^#course-(\d+)$/);if(!m)return;
  try{history.replaceState(null,'','#/course/'+m[1])}catch(e){location.hash='#/course/'+m[1]}}
let syncTimer=null,syncPending=false;
onRemoteChange=c=>{if(c==='activity')return;clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,250)};
async function syncNow(){if(!me||isEditRoute()||location.hash.startsWith('#/test'))return;try{await refresh()}catch(e){return}
  const f=document.activeElement;if(f&&f.closest&&f.closest('#app')&&(/INPUT|SELECT|TEXTAREA/.test(f.tagName)||f.isContentEditable)){syncPending=true;return}
  const open=[...document.querySelectorAll('.chapter.open [data-toggle]')].map(x=>x.dataset.toggle),y=scrollY;render();
  document.querySelectorAll('[data-toggle]').forEach(x=>{if(open.includes(x.dataset.toggle))x.parentElement.classList.add('open')});scrollTo(0,y)}
document.addEventListener('focusout',()=>{if(syncPending){syncPending=false;setTimeout(syncNow,0)}});
async function boot(){
  await dataReady;
  if(needsSignIn){$('#nav').hidden=true;$('#tabbar').hidden=true;
    $('#app').innerHTML=`<div class="auth"><div class="auth-card" style="text-align:center"><div class="logo">I</div><h1>Almost there</h1>
      <p class="sub">IRRLearning can’t reach its database yet.</p>
      <ol style="text-align:left;margin:0 0 22px 20px;color:var(--text-2);font-size:15px;line-height:1.6"><li>In Vercel, open this project’s <b>Settings → Environment Variables</b>.</li><li>Add <b>SUPABASE_URL</b> and <b>SUPABASE_ANON_KEY</b> from Supabase (<b>Project Settings → API</b>).</li><li>Go to <b>Deployments</b> and choose <b>Redeploy</b>.</li></ol>
      <button class="btn btn-primary btn-lg" onclick="location.reload()">Try again</button></div></div>`;return}
  if(dataLive&&canWrite===false){$('#nav').hidden=true;$('#tabbar').hidden=true;
    $('#app').innerHTML=`<div class="auth"><div class="auth-card" style="text-align:center"><div class="logo">I</div><h1>You need access to use IRRLearning</h1>
      <p class="sub">Your access to this page is <b>Can view</b>, so IRRLearning can’t save your account, progress or test results.</p>
      <ol style="text-align:left;margin:0 0 22px 20px;color:var(--text-2);font-size:15px;line-height:1.6"><li>Send your IRRLearning admin the email address you use for Claude.</li><li>They add you from the <b>Share</b> menu with <b>Contributor</b> access.</li><li>Reload this page, then register or sign in with your name and PIN.</li></ol>
      <button class="btn btn-primary btn-lg" onclick="location.reload()">I’ve been added. Try again</button></div></div>`;return}
  if(localMode&&!document.querySelector('.banner'))document.body.insertAdjacentHTML('afterbegin','<div class="banner">Preview mode: changes are saved in this browser only.</div>');
  takeDeepLink();
  const th=store.get('itrain.theme');if(th)document.documentElement.dataset.theme=th;
  if(token){try{await refresh();lastView=location.hash.split('/').slice(0,3).join('/');render();trackLogin();return}catch(e){token=null;store.set(TOKEN_KEY,null)}}
  try{const s=await api('GET','status');
    if(s.needsSetup&&!s.canSetup){$('#nav').hidden=true;$('#app').innerHTML=`<div class="auth"><div class="auth-card"><div class="logo">I</div><h1>IRRLearning isn’t set up yet</h1><p class="sub" style="margin-bottom:0">The owner of this page needs to open it and create the admin account first. Check back soon.</p></div></div>`;return}
    authScreen(s.needsSetup?'register':'signin',s.needsSetup)}
  catch(e){$('#app').innerHTML=`<div class="loading">Can’t reach the server. Please try again shortly.</div>`}
}
boot();
</script>
